name: "Dependency validation"
"on":
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
  workflow_dispatch: {}
permissions:
  contents: "read"
jobs:
  python:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]') }}
    runs-on: [self-hosted, Linux, X64, m3mb14]
    timeout-minutes: 45
    env:
      PYTHONPATH: "."
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.14"
      -
        run: "sudo apt-get update\nsudo apt-get install -y ffmpeg espeak-ng libsndfile1"
      -
        run: "python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \".[test]\"\npython -m pip check\npython -m pytest -q\npython -m compileall -q app.py setup.py audiosr tests\naudiosr --help"
