# Configuration for Cog ⚙️
# Reference: https://github.com/replicate/cog/blob/main/docs/yaml.md

build:
  # set to true if your model requires a GPU
  gpu: true
  cuda: "11.7"

  # a list of ubuntu apt packages to install
  system_packages:
    - "ffmpeg"
    - "libsndfile1"

  # python version in the form '3.8' or '3.8.12'
  python_version: "3.10"

  # a list of packages in the format <package-name>==<version>
  python_packages:
    - "torch==2.0.1"
    - "torchaudio==2.0.2"
    - "torchvision==0.15.2"
    - "tqdm==4.70.0"
    - "gradio==6.25.0"
    - "pyyaml==6.0.3"
    - "einops==0.8.2"
    - "chardet==7.6.0"
    - "numpy==1.26.4"
    - "soundfile==0.14.0"
    - "librosa==0.11.0"
    - "scipy==1.15.3"
    - "pandas==2.3.3"
    - "Pillow==12.3.0"
    - "requests==2.34.2"
    - "scikit-learn==1.7.2"
    - "matplotlib==3.10.9"
    - "unidecode==1.4.0"
    - "phonemizer==3.4.0"
    - "torchlibrosa==0.1.0"
    - "transformers==5.15.1"
    - "huggingface_hub==1.28.0"
    - "progressbar2==4.6.0"
    - "ftfy==6.3.1"
    - "timm==1.0.28"
    - "pyloudnorm==0.2.0"
    - "safetensors==0.8.0"

# predict.py defines how predictions are run on your model
predict: "predict.py:Predictor"
